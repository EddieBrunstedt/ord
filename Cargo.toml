[package]
name = "ord"
authors = ["Eddie Brunstedt <eddie.brunstedt@protonmail.com>"]
description = "Text processing with OpenAI models through templates"
categories = ["command-line-utilities"]
homepage = "https://github.com/EddieBrunstedt/ord"
repository = "https://github.com/EddieBrunstedt/ord"
edition = "2024"
license-file = "LICENSE"
version = "2.2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
copypasta-ext = "0.4"
ctrlc = "3.4"
dialoguer = "0.12"
maud = "*"
notify-rust = "4"
pulldown-cmark = "0.13"
regex = "1"
rig-core = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
toml = "1.0"
webbrowser = "1"

[dependencies.uuid]
features = [ "v4", "fast-rng", "macro-diagnostics"]
version = "1.8"

[dev-dependencies]
assert_matches = "1.5"
tempfile = "3.10"
