[package]
name = "ord"
authors = ["Eddie Brunstedt <eddie.brunstedt@protonmail.com>"]
description = "Text processing with OpenAI models through templates"
categories = ["command-line-utilities"]
homepage = "https://gitlab.com/EddieBrunstedt/ord"
edition = "2021"
license-file = "LICENSE"
version = "1.0.0"
exclude = ["/assets"]

[dependencies]
async-trait = "0.1"
clap = { version = "4.5.8", features = ["derive"] }
console = "0.15"
copypasta-ext = "0.4"
ctrlc = "3.4"
dialoguer = "0.11.0"
lazy_static = "1.4.0"
maud = "*"
notify-rust = "4"
pulldown-cmark = "0.11"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
text_io = "0.1.12"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
webbrowser = "1"

[dependencies.uuid]
features = [ "v4", "fast-rng", "macro-diagnostics"]
version = "1.8.0"

[dev-dependencies]
assert_matches = "1.5.0"
mockito = "1.4.0"
serial_test = "*"
tempfile = "3.10"
